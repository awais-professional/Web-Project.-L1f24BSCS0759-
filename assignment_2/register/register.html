<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EchoWave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Echo<span>Wave</span></div>
            <ul>
                <li><a href="../homepage/index.html">Home</a></li>
                <li><a href="../media/media.html">Media</a></li>
                <li><a href="register.html" class="active">Register</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Join the EchoWave Family</h1>
        <p>Create your account to get tickets, music updates and more.</p>

        <form action="#" method="post" class="register-form">

            <div class="form-group">
                <label for="fullname" class="required">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required minlength="3" maxlength="30">
            </div>
            <div class="form-group">
                <label for="password" class="required">Password</label>
                <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required minlength="6" maxlength="20">
            </div>
            <div class="form-group">
                <label for="email" class="required">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" min="1960-01-01" max="2012-12-31">
            </div>
            <div class="form-group">
                <label for="website">Website / Social Link</label>
                <input type="url" id="website" name="website" placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label for="fav-color">Favourite Colour</label>
                <input type="color" id="fav-color" name="fav-color" value="#ff4f19e3">
            </div>
            <div class="form-group">
                <label for="tickets">Number of Tickets</label>
                <input type="number" id="tickets" name="tickets" min="1" max="10" value="1">
            </div>
            <div class="form-group">
                <label for="show-time">Preferred Show Time</label>
                <input type="time" id="show-time" name="show-time">
            </div>
            <div class="form-group">
                <label for="volume">Volume Level</label>
                <input type="range" id="volume" name="volume" min="0" max="100" value="50">
            </div>

            <div class="form-group">
                <label for="genre">Favourite Genre</label>
                <select id="genre" name="genre">
                    <option value="electronic">Electronic</option>
                    <option value="hiphop">Hip Hop</option>
                    <option value="pop" selected>Pop</option>
                    <option value="instrumental">Instrumental</option>
                </select>
            </div>
            <div class="form-group">
                <label for="photo">Profile Photo</label>
                <input type="file" id="photo" name="photo">
            </div>
            <div class="form-group">
                <label for="member-id">Member ID</label>
                <input type="text" id="member-id" name="member-id" value="ECHO-2026" readonly>
            </div>
            <div class="form-group">
                <label for="vip">VIP Pass</label>
                <input type="text" id="vip" name="vip" value="Not available yet" disabled>
            </div>
            <div class="form-group">
                <label for="about">About You</label>
                <textarea id="about" name="about" rows="4" maxlength="200" placeholder="Tell us about your music taste"></textarea>
            </div>
            <div class="form-group options">
                <span>You are a:</span>
                <input type="radio" id="fan" name="usertype" value="fan" checked>
                <label for="fan">Fan</label>
                <input type="radio" id="artist" name="usertype" value="artist">
                <label for="artist">Artist</label>
            </div>
            <div class="form-group options">
                <input type="checkbox" id="newsletter" name="newsletter" checked>
                <label for="newsletter">Send me newsletter</label>
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms" class="required">I accept the terms</label>
            </div>
            <button type="submit">REGISTER NOW</button>

        </form>
    </main>
    <footer id="footer">
        <p>&copy; 2026 EchoWave. All Rights Reserved.</p>
    </footer>
</body>
</html>
